<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voeg recept toe</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .form-row {
            margin-bottom: 20px;
        }
        .form-row label {
            display: block;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--primary-color, #2697cf);
            margin-bottom: 6px;
        }
        .form-row input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fafafa;
            box-sizing: border-box;
        }
        .form-row input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color, #2697cf);
            box-shadow: 0 0 0 3px rgba(38,151,207,0.15);
        }
    </style>
</head>
<body>

    <!-- ── Header ── -->
    <div class="header compact-header">
        <a href="/" class="back-button" title="Terug naar Home">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="header-content">
            <div class="header-title">Voeg recept toe</div>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="container white-card">

            <form action="/add" method="POST" id="addRecipeForm">
                <div class="form-row">
                    <label for="title">Recept titel *</label>
                    <input type="text" id="title" name="title"
                           placeholder="Bijv. Spaghetti Carbonara"
                           required maxlength="255" autofocus>
                </div>

                <div class="button-bar" style="position:static; padding: 0; margin-top: 24px; display:flex; gap:12px;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Toevoegen
                    </button>
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Annuleren
                    </a>
                </div>
            </form>

        </div>
    </div>

    <script>
        document.getElementById('addRecipeForm').addEventListener('submit', function(e) {
            const title = document.getElementById('title').value.trim();
            if (title.length < 3) {
                e.preventDefault();
                alert('De titel moet minimaal 3 karakters lang zijn.');
                document.getElementById('title').focus();
            }
        });
    </script>

</body>
</html>
