name: Test en deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coolify-deploy starten
        env:
          COOLIFY_URL: https://coolify.flowfast.ai
          COOLIFY_APP_UUID: 1apirkkbwtvrvflz8bw5yff9
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::GitHub-secret COOLIFY_TOKEN ontbreekt (zie README)"; exit 1
          fi
          code=$(curl -sS -o resp.txt -w '%{http_code}' \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" || echo "000")
          body=$(head -c 400 resp.txt | tr '\n' ' ')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Coolify antwoordde HTTP $code: $body"; exit 1
          fi
          echo "::notice::Deploy gestart: $body"
